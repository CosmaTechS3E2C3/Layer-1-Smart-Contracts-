[package]
name = "cosmachain_smart_contracts"
version = "0.1.0"
edition = "2021"
authors = ["CosmaTech Technologies Inc."]
description = "Layer-1 Smart Contracts Engine for CosmaChain"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

# Optional but recommended for future DB integration
# rocksdb = "0.21"

# Logging (optional)
log = "0.4"

[dev-dependencies]
# For unit tests
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "cosmachain_smart_contracts"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

